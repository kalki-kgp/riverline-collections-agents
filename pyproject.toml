[project]
name = "riverline-collections-agents"
version = "0.1.0"
description = "Temporal-orchestrated self-learning collections agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "temporalio>=1.7.0",
    "pydantic>=2.8.0",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "reports*", "scripts*"]

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"
